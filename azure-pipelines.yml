# Main pipeline: builds selected Visual Studio versions in parallel.
# For individual VS version builds, use the standalone pipelines in build/pipelines/.
#
# By default, only VS2026 is built on commit/PR to master.
# To build other versions, set the 'vsVersions' parameter when queuing the build manually.

name: 2.3.$(revision).0

trigger:
- master

parameters:
  - name: vsVersions
    displayName: 'VS versions to build (select one or more)'
    type: object
    default:
      - vs2026

variables:
  revision: $[counter('', 0)]
  WaitForRemoteConnectionOnFailure: false

jobs:
# VS2010
- ${{ if containsValue(parameters.vsVersions, 'vs2010') }}:
  - template: build/pipelines/templates/build-job.yml
    parameters:
      vsDisplayName: 'Visual Studio 2010'
      vsVersion: '2010'
      visualStudioVersion: '10.0'
      msBuildPath: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
      targetFrameworkVersions:
        - v4.0
      includeIntegrationTests: true
      integrationTestTargetFrameworkVersions:
        - v4.0
      runTests: true
      publishNuGet: true

# VS2012
- ${{ if containsValue(parameters.vsVersions, 'vs2012') }}:
  - template: build/pipelines/templates/build-job.yml
    parameters:
      vsDisplayName: 'Visual Studio 2012'
      vsVersion: '2012'
      visualStudioVersion: '11.0'
      msBuildPath: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
      targetFrameworkVersions:
        - v4.0
      includeIntegrationTests: true
      integrationTestTargetFrameworkVersions:
        - v4.0
        - v4.5
      runTests: true
      publishNuGet: true

# VS2013
- ${{ if containsValue(parameters.vsVersions, 'vs2013') }}:
  - template: build/pipelines/templates/build-job.yml
    parameters:
      vsDisplayName: 'Visual Studio 2013'
      vsVersion: '2013'
      visualStudioVersion: '12.0'
      msBuildPath: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
      targetFrameworkVersions:
        - v4.5
        - v4.0
      includeIntegrationTests: true
      integrationTestTargetFrameworkVersions:
        - v4.5
        - v4.0
      runTests: true
      publishNuGet: true

# VS2015
- ${{ if containsValue(parameters.vsVersions, 'vs2015') }}:
  - template: build/pipelines/templates/build-job.yml
    parameters:
      vsDisplayName: 'Visual Studio 2015'
      vsVersion: '2015'
      visualStudioVersion: '14.0'
      msBuildPath: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
      targetFrameworkVersions:
        - v4.0
      includeIntegrationTests: true
      integrationTestTargetFrameworkVersions:
        - v4.0
      runTests: true
      publishNuGet: true

# VS2017
- ${{ if containsValue(parameters.vsVersions, 'vs2017') }}:
  - template: build/pipelines/templates/build-job.yml
    parameters:
      vsDisplayName: 'Visual Studio 2017'
      vsVersion: '2017'
      visualStudioVersion: '15.0'
      msBuildPath: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
      targetFrameworkVersions:
        - v4.0
      includeIntegrationTests: true
      integrationTestTargetFrameworkVersions:
        - v4.0
      runTests: true
      publishNuGet: true

# VS2019
- ${{ if containsValue(parameters.vsVersions, 'vs2019') }}:
  - template: build/pipelines/templates/build-job.yml
    parameters:
      vsDisplayName: 'Visual Studio 2019'
      vsVersion: '2019'
      visualStudioVersion: '16.0'
      msBuildPath: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
      targetFrameworkVersions:
        - v4.0
      includeIntegrationTests: true
      integrationTestTargetFrameworkVersions:
        - v4.0
      runTests: true
      publishNuGet: true

# VS2022
- ${{ if containsValue(parameters.vsVersions, 'vs2022') }}:
  - template: build/pipelines/templates/build-job.yml
    parameters:
      vsDisplayName: 'Visual Studio 2022'
      vsVersion: '2022'
      visualStudioVersion: '17.0'
      msBuildPath: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
      targetFrameworkVersions:
        - v4.7.2
      includeIntegrationTests: true
      integrationTestTargetFrameworkVersions:
        - v4.7.2
      runTests: true
      runSettingsFile: 'src\Local_CUITv17.runsettings'
      publishNuGet: true

# VS2026
- ${{ if containsValue(parameters.vsVersions, 'vs2026') }}:
  - template: build/pipelines/templates/build-job.yml
    parameters:
      vsDisplayName: 'Visual Studio 2026'
      vsVersion: '2026'
      visualStudioVersion: '18.0'
      targetFrameworkVersions:
        - v4.7.2
      includeIntegrationTests: true
      integrationTestTargetFrameworkVersions:
        - v4.7.2
      runTests: true
      runSettingsFile: 'src\Local_CUITv18.runsettings'
      testPlatformVersion: '17.13.0'
      testAssemblyExcludes: '!**\Sut.Silverlight*'
      publishNuGet: true

# Git tag after all jobs succeed
- job: GitTag
  displayName: 'Git Tag'
  dependsOn:
    - ${{ if containsValue(parameters.vsVersions, 'vs2010') }}:
      - Publish_2010
    - ${{ if containsValue(parameters.vsVersions, 'vs2012') }}:
      - Publish_2012
    - ${{ if containsValue(parameters.vsVersions, 'vs2013') }}:
      - Publish_2013
    - ${{ if containsValue(parameters.vsVersions, 'vs2015') }}:
      - Publish_2015
    - ${{ if containsValue(parameters.vsVersions, 'vs2017') }}:
      - Publish_2017
    - ${{ if containsValue(parameters.vsVersions, 'vs2019') }}:
      - Publish_2019
    - ${{ if containsValue(parameters.vsVersions, 'vs2022') }}:
      - Publish_2022
    - ${{ if containsValue(parameters.vsVersions, 'vs2026') }}:
      - Publish_2026
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  pool:
    vmImage: 'windows-2025'
  steps:
    - checkout: self
      persistCredentials: true
    - task: PowerShell@2
      displayName: 'Git Tag'
      env:
        tag: '$(Build.BuildNumber)'
      inputs:
        targetType: 'inline'
        workingDirectory: $(Build.SourcesDirectory)
        ignoreLASTEXITCODE: false
        errorActionPreference: continue
        failOnStderr: false
        script: |
          Write-Host "git tag $env:tag"
          git tag $env:tag
          Write-Host "git push origin $env:tag"
          git push origin $env:tag
